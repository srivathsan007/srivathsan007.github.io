<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#05020d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e0ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#05020d;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="900" fill="#05020d"/>
  
  <text x="450" y="50" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">AWS MCP Server Reaches GA: Enterprise-Grade</text>
  <text x="450" y="82" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">IAM Governance for Agentic AI Workflows</text>
  
  <!-- Card 1 - Top Left -->
  <rect x="50" y="130" width="380" height="280" rx="16" fill="url(#grad1)" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <path d="M120 200 L120 240 L180 240 L180 280 L140 280 L160 310 L180 280 L220 280 L220 240 L280 240 L280 200 L200 200 L200 170 L200 200 Z" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#glow1)"/>
  <circle cx="200" cy="185" r="25" fill="none" stroke="#a855f7" stroke-width="2"/>
  <text x="70" y="340" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">GA Release</text>
  <text x="70" y="365" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">AWS MCP Server GA release enables</text>
  <text x="70" y="385" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">enterprise-grade Model Context Protocol</text>
  <text x="70" y="405" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">for production AI agent deployments.</text>
  
  <!-- Card 2 - Top Right -->
  <rect x="470" y="130" width="380" height="280" rx="16" fill="url(#grad2)" stroke="#00e0ff" stroke-width="2" filter="url(#glow2)"/>
  <path d="M620 180 L620 220 M600 200 L640 200 M620 200 L620 260 L590 260 L590 290 L650 290 L650 260 L620 260" fill="none" stroke="#00e0ff" stroke-width="2.5"/>
  <rect x="580" y="170" width="80" height="50" rx="8" fill="none" stroke="#00e0ff" stroke-width="2" filter="url(#glow2)"/>
  <circle cx="620" cy="270" r="8" fill="#00e0ff" opacity="0.5"/>
  <text x="490" y="340" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Zero Trust IAM</text>
  <text x="490" y="365" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Native IAM integration enforces Zero</text>
  <text x="490" y="385" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Trust principles by requiring explicit</text>
  <text x="490" y="405" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">authentication for every AI request.</text>
  
  <!-- Card 3 - Bottom Left -->
  <rect x="50" y="450" width="380" height="280" rx="16" fill="url(#grad2)" stroke="#00e0ff" stroke-width="2" filter="url(#glow2)"/>
  <rect x="150" y="500" width="100" height="70" rx="6" fill="none" stroke="#00e0ff" stroke-width="2"/>
  <rect x="165" y="515" width="30" height="20" rx="3" fill="#00e0ff" opacity="0.4"/>
  <rect x="205" y="515" width="30" height="20" rx="3" fill="#00e0ff" opacity="0.4"/>
  <rect x="165" y="545" width="30" height="15" rx="3" fill="#00e0ff" opacity="0.4"/>
  <path d="M130 535 L150 535 M250 535 L270 535 M200 490 L200 500 M200 570 L200 590" stroke="#00e0ff" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="70" y="660" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">VPC Architecture</text>
  <text x="70" y="685" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Deploy MCP Server in private subnets</text>
  <text x="70" y="705" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">with VPC endpoints, cross-account</text>
  <text x="70" y="725" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">access, and network isolation.</text>
  
  <!-- Card 4 - Bottom Right -->
  <rect x="470" y="450" width="380" height="280" rx="16" fill="url(#grad1)" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <path d="M620 500 L580 540 L620 580 L660 540 Z" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M620 515 L595 540 L620 565 L645 540 Z" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <path d="M620 530 L608 540 L620 550 L632 540 Z" fill="#a855f7" opacity="0.5"/>
  <circle cx="620" cy="540" r="35" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <text x="490" y="660" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Defense-in-Depth</text>
  <text x="490" y="685" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Implement defense-in-depth with layered</text>
  <text x="490" y="705" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">controls: IAM permissions, resource</text>
  <text x="490" y="725" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">policies, and network boundaries.</text>
  
  <!-- Connecting Arrows -->
  <path d="M430 270 L470 270" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" filter="url(#glow1)"/>
  <path d="M240 410 L240 450" stroke="#00e0ff" stroke-width="2" filter="url(#glow2)"/>
  <path d="M660 410 L660 450" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <path d="M430 590 L470 590" stroke="#00e0ff" stroke-width="2" filter="url(#glow2)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00e0ff"/>
    </marker>
  </defs>
  
  <!-- Arrow heads -->
  <polygon points="470,265 460,270 470,275" fill="#a855f7"/>
  <polygon points="235,450 240,440 245,450" fill="#00e0ff"/>
  <polygon points="655,450 660,440 665,450" fill="#a855f7"/>
  <polygon points="470,585 460,590 470,595" fill="#00e0ff"/>
  
  <!-- Center connection -->
  <circle cx="450" cy="430" r="20" fill="#05020d" stroke="#a855f7" stroke-width="1.5" filter="url(#glow1)"/>
  <path d="M442 430 L450 422 L458 430 L450 438 Z" fill="#a855f7"/>
  
  <!-- Tag Pills -->
  <rect x="200" y="800" width="130" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <text x="265" y="821" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle">AWS Security</text>
  
  <rect x="350" y="800" width="200" height="32" rx="16" fill="none" stroke="#00e0ff" stroke-width="1.5"/>
  <text x="450" y="821" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff" text-anchor="middle">Model Context Protocol</text>
  
  <rect x="570" y="800" width="130" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <text x="635" y="821" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle">AI Governance</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="850" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="70" cy="860" r="2" fill="#00e0ff" opacity="0.5"/>
  <circle cx="830" cy="850" r="3" fill="#00e0ff" opacity="0.5"/>
  <circle cx="850" cy="860" r="2" fill="#a855f7" opacity="0.5"/>
  
  <!-- Subtle grid pattern -->
  <line x1="450" y1="130" x2="450" y2="730" stroke="#a855f7" stroke-width="0.5" opacity="0.2" stroke-dasharray="5,10"/>
  <line x1="50" y1="430" x2="850" y2="430" stroke="#00e0ff" stroke-width="0.5" opacity="0.2" stroke-dasharray="5,10"/>
</svg>