<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#05020d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e0ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#05020d;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="900" fill="#05020d"/>
  
  <text x="450" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">How OpenAI Built a Secure Windows Sandbox</text>
  <text x="450" y="80" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">for Codex Agents</text>
  <text x="450" y="115" font-family="system-ui, sans-serif" font-size="16" fill="#a855f7" text-anchor="middle">Architecture Lessons for Enterprise Security</text>
  
  <!-- Card 1 - Top Left -->
  <rect x="50" y="150" width="380" height="280" rx="16" fill="url(#grad1)" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <circle cx="90" cy="195" r="25" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M80 195 L85 190 L95 200 L100 185" stroke="#a855f7" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M75 210 L105 210 M90 195 L90 225" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.5"/>
  <text x="130" y="200" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">EPHEMERAL CONTAINERS</text>
  <text x="70" y="245" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Hyper-V containers with complete</text>
  <text x="70" y="265" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">state destruction ensure no data</text>
  <text x="70" y="285" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">persistence between sessions.</text>
  <text x="70" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7">• Isolated memory spaces</text>
  <text x="70" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7">• Automatic cleanup on termination</text>
  <text x="70" y="355" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7">• Zero trust architecture</text>
  
  <!-- Card 2 - Top Right -->
  <rect x="470" y="150" width="380" height="280" rx="16" fill="url(#grad2)" stroke="#00e0ff" stroke-width="2" filter="url(#glow2)"/>
  <rect x="490" y="175" width="40" height="30" rx="4" fill="none" stroke="#00e0ff" stroke-width="2"/>
  <path d="M495 190 L510 180 L525 190 M500 195 L520 195" stroke="#00e0ff" stroke-width="1.5" fill="none"/>
  <circle cx="510" cy="215" r="8" fill="none" stroke="#00e0ff" stroke-width="1.5"/>
  <text x="550" y="200" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">EXTERNAL MONITORING</text>
  <text x="490" y="245" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Behavioral monitoring must operate</text>
  <text x="490" y="265" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">outside the sandbox boundary to</text>
  <text x="490" y="285" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">prevent agent manipulation.</text>
  <text x="490" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff">• Host-level telemetry</text>
  <text x="490" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff">• Independent threat detection</text>
  <text x="490" y="355" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff">• Tamper-proof logging</text>
  
  <!-- Card 3 - Bottom Left -->
  <rect x="50" y="470" width="380" height="280" rx="16" fill="url(#grad2)" stroke="#00e0ff" stroke-width="2" filter="url(#glow2)"/>
  <path d="M80 510 L110 510 M80 520 L100 520 M80 530 L110 530" stroke="#00e0ff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M95 500 L95 540 L115 520 Z" fill="none" stroke="#00e0ff" stroke-width="1.5"/>
  <text x="130" y="520" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">INJECTION DEFENSE</text>
  <text x="70" y="565" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Defense against prompt injection</text>
  <text x="70" y="585" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">requires both input sanitization</text>
  <text x="70" y="605" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">and output validation layers.</text>
  <text x="70" y="635" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff">• Multi-layer filtering</text>
  <text x="70" y="655" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff">• Context boundary enforcement</text>
  <text x="70" y="675" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff">• Anomaly detection systems</text>
  
  <!-- Card 4 - Bottom Right -->
  <rect x="470" y="470" width="380" height="280" rx="16" fill="url(#grad1)" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <rect x="490" y="495" width="35" height="45" rx="4" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="507" cy="510" r="8" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <path d="M500 525 L515 525 M500 530 L510 530" stroke="#a855f7" stroke-width="1" fill="none"/>
  <text x="540" y="520" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">ENTERPRISE INTEGRATION</text>
  <text x="490" y="565" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Enterprise deployments must</text>
  <text x="490" y="585" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">integrate identity binding, DLP</text>
  <text x="490" y="605" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">policies, and audit compliance.</text>
  <text x="490" y="635" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7">• SSO/MFA integration</text>
  <text x="490" y="655" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7">• Data loss prevention</text>
  <text x="490" y="675" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7">• Regulatory compliance logging</text>
  
  <!-- Connecting Arrows -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00e0ff"/>
    </marker>
  </defs>
  
  <path d="M430 290 L470 290" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead1)" filter="url(#glow1)"/>
  <path d="M240 430 L240 470" stroke="#00e0ff" stroke-width="2" marker-end="url(#arrowhead2)" filter="url(#glow2)"/>
  <path d="M660 430 L660 470" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead1)" filter="url(#glow1)"/>
  <path d="M430 610 L470 610" stroke="#00e0ff" stroke-width="2" marker-end="url(#arrowhead2)" filter="url(#glow2)"/>
  
  <!-- Center connection -->
  <circle cx="450" cy="450" r="20" fill="#05020d" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <path d="M443 450 L450 443 L457 450 L450 457 Z" fill="#00e0ff"/>
  
  <!-- Tag Pills -->
  <rect x="250" y="800" width="100" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" filter="url(#glow1)"/>
  <text x="300" y="821" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle">AI Security</text>
  
  <rect x="370" y="800" width="100" height="32" rx="16" fill="none" stroke="#00e0ff" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="420" y="821" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff" text-anchor="middle">Sandboxing</text>
  
  <rect x="490" y="800" width="100" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" filter="url(#glow1)"/>
  <text x="540" y="821" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle">Agentic AI</text>
  
  <!-- Decorative elements -->
  <circle cx="50" y="860" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="70" y="865" r="2" fill="#00e0ff" opacity="0.5"/>
  <circle cx="830" y="855" r="3" fill="#00e0ff" opacity="0.5"/>
  <circle cx="850" y="862" r="2" fill="#a855f7" opacity="0.5"/>
</svg>