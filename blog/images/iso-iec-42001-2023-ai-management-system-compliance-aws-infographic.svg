<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#05020d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e0ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#05020d;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="900" fill="#05020d"/>
  
  <text x="450" y="55" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">ISO/IEC 42001:2023 AI Management System</text>
  <text x="450" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Compliance on AWS: A Practical Implementation Guide</text>
  
  <!-- Card 1 - Top Left -->
  <rect x="50" y="130" width="380" height="280" rx="16" fill="url(#grad1)" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <circle cx="90" cy="175" r="25" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M80 175 L85 180 L100 165" stroke="#a855f7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="125" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">International Standard</text>
  <text x="70" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">ISO/IEC 42001:2023 is the first</text>
  <text x="70" y="240" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">international standard for AI</text>
  <text x="70" y="260" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Management Systems (AIMS). It provides</text>
  <text x="70" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">a comprehensive framework for</text>
  <text x="70" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">organizations to responsibly develop,</text>
  <text x="70" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">deploy, and manage AI systems with</text>
  <text x="70" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">proper governance controls.</text>
  
  <!-- Card 2 - Top Right -->
  <rect x="470" y="130" width="380" height="280" rx="16" fill="url(#grad2)" stroke="#00e0ff" stroke-width="2" filter="url(#glow1)"/>
  <rect x="500" y="155" width="40" height="40" rx="6" fill="none" stroke="#00e0ff" stroke-width="2"/>
  <path d="M510 175 L530 175 M520 165 L520 185" stroke="#00e0ff" stroke-width="2" stroke-linecap="round"/>
  <text x="550" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">AWS Service Mapping</text>
  <text x="490" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">AWS's compliance guide maps services</text>
  <text x="490" y="240" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">like SageMaker, Bedrock, and other</text>
  <text x="490" y="260" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">AI/ML services to ISO 42001 controls.</text>
  <text x="490" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">This mapping enables organizations to</text>
  <text x="490" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">leverage existing AWS infrastructure</text>
  <text x="490" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">while meeting compliance requirements</text>
  <text x="490" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">for AI governance and risk management.</text>
  
  <!-- Card 3 - Bottom Left -->
  <rect x="50" y="450" width="380" height="280" rx="16" fill="url(#grad2)" stroke="#00e0ff" stroke-width="2" filter="url(#glow1)"/>
  <path d="M75 505 L95 485 L115 505 L95 525 Z" fill="none" stroke="#00e0ff" stroke-width="2"/>
  <circle cx="95" cy="505" r="8" fill="#00e0ff"/>
  <text x="130" y="510" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Human Oversight</text>
  <text x="70" y="550" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Human oversight and transparency are</text>
  <text x="70" y="570" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">foundational requirements in ISO 42001.</text>
  <text x="70" y="590" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Organizations must establish clear</text>
  <text x="70" y="610" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">accountability structures, document AI</text>
  <text x="70" y="630" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">decision-making processes, and ensure</text>
  <text x="70" y="650" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">meaningful human control over critical</text>
  <text x="70" y="670" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">AI system operations and outcomes.</text>
  
  <!-- Card 4 - Bottom Right -->
  <rect x="470" y="450" width="380" height="280" rx="16" fill="url(#grad1)" stroke="#a855f7" stroke-width="2" filter="url(#glow1)"/>
  <path d="M500 485 L540 485 L540 525 L500 525 Z" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M510 495 L530 495 M510 505 L530 505 M510 515 L525 515" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <text x="555" y="510" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">ISO 27001 Integration</text>
  <text x="490" y="550" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Organizations with existing ISO 27001</text>
  <text x="490" y="570" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">certifications can leverage their</text>
  <text x="490" y="590" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">information security management systems</text>
  <text x="490" y="610" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">as a foundation for ISO 42001. The</text>
  <text x="490" y="630" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">standards share common Annex SL</text>
  <text x="490" y="650" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">structure, enabling efficient integrated</text>
  <text x="490" y="670" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">management system implementation.</text>
  
  <!-- Connecting Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00e0ff"/>
    </marker>
  </defs>
  
  <!-- Horizontal arrow top -->
  <line x1="430" y1="270" x2="465" y2="270" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead)" filter="url(#glow2)"/>
  
  <!-- Horizontal arrow bottom -->
  <line x1="430" y1="590" x2="465" y2="590" stroke="#00e0ff" stroke-width="2" marker-end="url(#arrowhead2)" filter="url(#glow2)"/>
  
  <!-- Vertical arrow left -->
  <line x1="240" y1="410" x2="240" y2="445" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead)" filter="url(#glow2)"/>
  
  <!-- Vertical arrow right -->
  <line x1="660" y1="410" x2="660" y2="445" stroke="#00e0ff" stroke-width="2" marker-end="url(#arrowhead2)" filter="url(#glow2)"/>
  
  <!-- Diagonal arrows -->
  <line x1="420" y1="400" x2="480" y2="460" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#glow2)"/>
  <line x1="480" y1="400" x2="420" y2="460" stroke="#00e0ff" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#glow2)"/>
  
  <!-- Tag Pills -->
  <rect x="220" y="780" width="120" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" filter="url(#glow1)"/>
  <text x="280" y="801" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle">ISO 42001</text>
  
  <rect x="360" y="780" width="140" height="32" rx="16" fill="none" stroke="#00e0ff" stroke-width="1.5" filter="url(#glow1)"/>
  <text x="430" y="801" font-family="system-ui, sans-serif" font-size="12" fill="#00e0ff" text-anchor="middle">AI Governance</text>
  
  <rect x="520" y="780" width="140" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" filter="url(#glow1)"/>
  <text x="590" y="801" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle">AWS Security</text>
  
  <!-- Shield icon in center -->
  <path d="M450 420 L450 445 C450 460 440 475 450 485 C460 475 450 460 450 445 L450 420" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="850" cy="50" r="3" fill="#00e0ff" opacity="0.5"/>
  <circle cx="50" cy="850" r="3" fill="#00e0ff" opacity="0.5"/>
  <circle cx="850" cy="850" r="3" fill="#a855f7" opacity="0.5"/>
  
  <text x="450" y="860" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" opacity="0.6">Enterprise Security Compliance Framework</text>
</svg>